# Tests of the keel-lamp stack (decision 0006 point 4):
#   tests:      the boot test's library under bats and kcov, on hosted
#               runners, with the threshold committed here
#   appliance:  fetch the published lapp layer, verify it, assemble it, boot
#               it in LXC and run tests/boot-test.sh against it
#   appliance-client: the same for the lapp-client layer, whose boot test
#               proves the absence of a database server
#   package:    a change that the layer ships needs a changelog entry, so it
#               can reach a machine
#
# There are two appliance jobs because this recipe produces two artefacts and
# the difference between them is only visible on a running machine. One job
# with both would hide which of the two failed, and the one that must be
# proved most carefully is the one whose whole purpose is an absence.
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    # tests/coverage.sh measures one shell file (COVERAGE.md): the logic of
    # the boot test, at 100 percent. The threshold is the measured number and
    # is only ever raised (decision 0006). This job produces the check
    # "tests / coverage", a required status on the default branch. The job id
    # is part of that name, so renaming it silently detaches the protection
    # rule.
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 100
  appliance:
    # The boot test of the artefact with a local database server: the layer is
    # fetched from https://mirror.keellinux.org/layers, verified, assembled
    # into a scratch rootfs, booted in LXC and checked by tests/boot-test.sh.
    # Nothing is built there; the build host publishes the layer
    # (docs/releases-host.md of the keel repository). So what boots is the
    # layer the mirror publishes, never this branch: a pull request that
    # changes the recipe is not exercised by these checks, which is why the
    # reusable job is called boot-published-layer.
    #
    # test-appliance.yml targets the labels "self-hosted, keel-lxc"; a job
    # aimed at a label no runner carries stays queued until GitHub cancels it
    # after 24 hours, so the reusable workflow's contract is that callers gate
    # on the organization variable KEEL_LXC_RUNNER (docs/ci-cd.md section 5 of
    # the keel repository). A layer that has never been published fails this
    # job instead of passing it; the bootstrap exemption for a repository
    # whose first layer does not exist yet is allow_unpublished, and both
    # layers here are published, so it is not used. This job produces the
    # check "appliance / boot-published-layer".
    if: vars.KEEL_LXC_RUNNER == 'true'
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: lapp
      # A child of the shared web layer; the workflow checks this against the
      # parent the published manifest records, so it says so if the mirror
      # ever serves a lapp built on something else.
      parent: apache-php
      # One container. This stack is one machine: the replication modes of
      # handbook decision 0013 belong to the database appliance, which is
      # where the two node gate lives.
      timeout: 60
  appliance-client:
    # The same, for the artefact whose database is somewhere else. Its boot
    # test asks the running machine to prove it has no database server: no
    # package, no data directory, nothing listening on 3306 and no process.
    # That is the reason the artefact exists, and an idle server shipped in it
    # would be the cheapest failure to miss. This job produces the check
    # "appliance-client / boot-published-layer".
    if: vars.KEEL_LXC_RUNNER == 'true'
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: lapp-client
      parent: apache-php
      timeout: 60
  package:
    # Only on a pull request. require-changelog compares the two commits of
    # the pull request, which it reads from
    # github.event.pull_request.base.sha; outside a pull request that is empty
    # and the script is handed one argument instead of two, so every push to
    # the default branch failed the check. A job whose condition is false is
    # reported as skipped, which satisfies a required status, so protection
    # keeps working and the check is still a real run on the pull request
    # itself, which is the only place it can say anything.
    if: github.event_name == 'pull_request'
    # This recipe has no debian/changelog: what bt-layer records in the
    # manifest is the top entry of ./changelog, which is also what
    # make-release-deb.py turns into the release package. So that is the file
    # a change which ships has to bump. This job produces the check
    # "package / changelog".
    uses: keel-linux/.github/.github/workflows/require-changelog.yml@main
    with:
      changelog: changelog
      # keel/ is the example instance descriptions, which the layer does not
      # ship; .art/ is the upstream screenshots; the rest is the reusable
      # workflow's own default.
      exempt: '^(tests/|docs/|\.github/|keel/|\.art/|README|COVERAGE\.md|LICENSE|\.gitignore)'
