# Instance description of a LAPP appliance, IPv6 first (docs/spec.md in the
# keel repository). Copy to /etc/keel/instance.yaml and create the secret
# files (mode 0600, owned by root) before the first boot:
#
#   /etc/keel/secrets/root_password
#   /etc/keel/secrets/db_password
#
# This is the description of the artefact with a local database server. The
# lapp-client artefact has no server and no account of its own, so it declares
# no db_password: see keel/instance-client.example.yaml.
version: 1

instance:
  hostname: lapp
  fqdn: lapp.example.org

network:
  # LXC: the host owns eth0 and the address comes by SLAAC from the host's
  # /64. Switch to method static with an address once a DNS record points at
  # it, so the address the record names never moves.
  managed_by: host
  interfaces:
    eth0:
      ipv6:
        method: auto

tls:
  acme:
    # Left off in the example, because a certificate request needs a name that
    # resolves. The stack serves on 80 and 443 with the self-signed
    # certificate core installs, so switching this on is the first thing a
    # real deployment does: 15regen-sslcert replaces the certificate at first
    # boot and Apache reads /etc/ssl/private/cert.pem.
    enabled: false

secrets:
  root_password:
    file: /etc/keel/secrets/root_password
  # Rendered as DB_PASS for the first boot hooks. It is the password of the
  # postgres superuser role, which the build created unusable; 35pgsqlpass
  # gives it this one at first boot. The database listens on ::1 and
  # 127.0.0.1 and nowhere else, so this account is reachable from the machine
  # itself and from Adminer on it.
  db_password:
    file: /etc/keel/secrets/db_password

hub:
  api_key: skip

security:
  alerts: skip
  updates_at_first_boot: skip

first_login_wizard: false
